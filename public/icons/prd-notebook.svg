<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- notebook body -->
  <rect x="16" y="10" width="36" height="46" rx="3.5" fill="#F4F1EA" stroke="#D4C8B0" stroke-width="1.5"/>
  <!-- ruled lines -->
  <path d="M24 22h22M24 30h22M24 38h18M24 46h20" stroke="#C9BFAE" stroke-width="1.4" stroke-linecap="round"/>
  <!-- red margin -->
  <path d="M23 12v42" stroke="#E86A6A" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- spiral coils -->
  <g fill="#6B7280" stroke="#4B5563" stroke-width="0.8">
    <ellipse cx="16" cy="18" rx="3.2" ry="2.4"/>
    <ellipse cx="16" cy="26" rx="3.2" ry="2.4"/>
    <ellipse cx="16" cy="34" rx="3.2" ry="2.4"/>
    <ellipse cx="16" cy="42" rx="3.2" ry="2.4"/>
    <ellipse cx="16" cy="50" rx="3.2" ry="2.4"/>
  </g>
  <!-- coil holes highlight -->
  <g fill="#E8E4DC">
    <circle cx="16" cy="18" r="1.1"/>
    <circle cx="16" cy="26" r="1.1"/>
    <circle cx="16" cy="34" r="1.1"/>
    <circle cx="16" cy="42" r="1.1"/>
    <circle cx="16" cy="50" r="1.1"/>
  </g>
</svg>
